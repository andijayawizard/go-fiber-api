root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/main ."
  bin = "tmp/main"
  # full_bin = true
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["vendor", "tmp", "node_modules"]
  delay = 1000
  log = "air.log"

[log]
  time = true
  color = "true"
