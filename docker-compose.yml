# version: '3.9'

services:
  app:
    image: andijaya/go-fiber-app:dev
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: go-fiber-dev
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - /app/tmp
    command: air
    depends_on:
      - db
    networks:
      - app-net

  db:
    image: postgres:14-alpine
    container_name: postgres-dev
    restart: always
    ports:
      - "54321:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

volumes:
  dev_postgres_data:

networks:
  app-net:
    driver: bridge
